<div class="lista-wrapper">
    <header class="lista-header">
        <div>
            <h2>🏭 Máquinas</h2>
            <p>Visualize e gerencie as máquinas do sistema</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <input type="text" class="search-bar-inline" placeholder="🔍 Pesquisar..." oninput="filtrarTabela(this.value, listarMaquinas)">
            <button class="btn-novo" onclick="abrirPopupNovaMaquina()">+ Nova Máquina</button>
        </div>
    </header>

    <div class="table-container">
        <table class="custom-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome/Marca</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>
    <div><button id="BtnAtualizar" onclick="listarMaquinas()">Atualizar tabela</button></div>

    <!-- POPUP NOVA MÁQUINA -->
    <dialog id="popup-nova-maquina" class="popup-cadastro">
        <button class="popup-fechar" onclick="document.getElementById('popup-nova-maquina').close()">✕</button>
        <h2>➕ Nova Máquina</h2>
        <p>Preencha os dados abaixo para cadastrar no sistema</p>
        <div class="input-group">
            <label>Nome ou marca</label>
            <input type="text" id="name" placeholder="Ex: Mazak">
        </div>
        <div class="input-group">
            <label for="Cat">Categoria</label>
            <select id="Cat" name="Cat" class="custom-select">
                <option value="" disabled selected>Selecione uma categoria...</option>
                <option value="Fresa_Manual">🛠️ Fresa - Manual</option>
                <option value="Fresa_CNC">🛠️ Fresa - CNC</option>
                <option value="Torno_Manual">🛠️ Torno - Manual</option>
                <option value="Torno-CNC">🛠️ Torno - CNC</option>
            </select>
        </div>
        <button type="button" id="BtnCadastrar" onclick="CadastrarMaquina()">Cadastrar</button>
        <footer class="form-footer"><p>© 2026 UsinagensPro V1.0</p></footer>
    </dialog>

    <!-- POPUP EDITAR MÁQUINA (já existia) -->
    <dialog id="meuPopupMaquina">
        <header><h2>Alterar dados da máquina</h2></header>
        <div class="input-group"><label>Nome/Marca</label><input type="text" id="nameMaq" placeholder="Ex: Mazak"></div>
        <div class="input-group">
            <label for="CatMaq2">Categoria</label>
            <select id="CatMaq2" class="custom-select">
                <option value="Fresa_Manual">🛠️ Fresa - Manual</option>
                <option value="Fresa_CNC">🛠️ Fresa - CNC</option>
                <option value="Torno_Manual">🛠️ Torno - Manual</option>
                <option value="Torno-CNC">🛠️ Torno - CNC</option>
            </select>
        </div>
        <button class="btn-novo" type="button" onclick="salvarAlteracoesMaq()">Modificar dados</button>
        <footer class="form-footer"><p>© 2026 UsinagensPro V1.0</p></footer>
    </dialog>
</div>
